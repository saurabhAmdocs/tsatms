<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TSATMS Login</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>Telecom Service Assurance System</h1>
    <p>Each role opens its own page after login.</p>
  </header>
  <main>
    <section class="card">
      <h2>Secure Login</h2>
      <div class="roles">customer / Customer@123<br>desk / Desk@123<br>engineer / Engineer@123<br>manager / Manager@123</div>
      <input id="user" placeholder="Username">
      <input id="pass" type="password" placeholder="Password">
      <div><b>CAPTCHA:</b> <span id="captcha"></span></div>
      <input id="cap" placeholder="CAPTCHA">
      <button onclick="login()">Continue</button>
      <div id="otpbox" hidden>
        <input id="otp" placeholder="OTP">
        <button onclick="verifyOtp()">Verify OTP</button>
      </div>
      <p id="msg"></p>
    </section>
  </main>
  <script src="/common.js"></script>
  <script src="/app.js"></script>
</body>
</html>
